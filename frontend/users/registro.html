<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Registro - ECO-S</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="dashboard-wrapper">
        
        <!-- Menú Lateral Registro -->
        <nav class="sidebar">
            <h2>Registro ECO-S</h2>
            <a href="#" class="nav-link active">Inventario Activo</a>
            <a href="../login.html" class="nav-link btn-logout">Cerrar Sesión</a>
        </nav>

        <main class="main-content">
            
            <div class="header-actions">
                <h1>Atención en Central: Objetos</h1>
                <div>
                    <button class="btn-primary" onclick="abrirModalCarga()">+ Registrar Elemento</button>
                </div>
            </div>

            <!-- Panel de Indicadores y Filtros -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="contadorActivos">--</h3>
                    <p>Objetos Activos en Central</p>
                </div>
            </div>
            
            <div class="filters-bar" style="margin-bottom: 1.5rem; background: var(--white); padding: 1rem; border-radius: 8px; box-shadow: var(--shadow-sm);">
                <input type="text" id="buscadorCodigo" class="form-control" placeholder="🔍 Buscar por código para entregar (Ej: 1001)" autocomplete="off">
                <input type="hidden" id="filtroEstado" value="Activo">
            </div>
            
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Foto</th>
                            <th>Clasificación</th>
                            <th>Descripción</th>
                            <th>Lugar del Hallazgo</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaAdmin"></tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- Modal para Subir Elemento -->
    <div id="modalCarga" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Registrar Objeto Recuperado</h3>
                <button class="btn-close" onclick="cerrarModalCarga()">×</button>
            </div>
            
            <form id="formSubirElemento" onsubmit="guardarElemento(event)" autocomplete="off">
                <p class="text-muted" style="font-size: 0.85rem; margin-top: 0;">Código asignado: <strong id="codigoGenerado">--</strong></p>

                <div class="form-group">
                    <label for="fechaHallazgo">Fecha de hallazgo *</label>
                    <input type="date" id="fechaHallazgo" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="lugarHallazgo">Lugar exacto (Texto libre) *</label>
                    <input type="text" id="lugarHallazgo" class="form-control" required placeholder="Ej: Sótano 2, parqueadero de motos">
                </div>

                <div class="form-group">
                    <label for="clasificacion">Clasificación *</label>
                    <select id="clasificacion" class="form-control" required>
                        <option value="">Seleccione una opción...</option>
                        <option value="Accesorio">Accesorio</option>
                        <option value="Joyería">Joyería</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Tecnología">Tecnología</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción corta *</label>
                    <input type="text" id="descripcion" class="form-control" required placeholder="Color, marca, detalles particulares">
                </div>

                <!-- MÓDULO MEJORADO DE CAPTURA Y CARGA DE FOTOGRAFÍA -->
                <div class="foto-uploader-container">
                    <label class="form-label" style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Fotografía del Objeto Recuperado:</label>
                    
                    <!-- Botones de Acción Directa -->
                    <div class="opciones-foto-buttons">
                        <button type="button" class="btn-foto" onclick="document.getElementById('inputCamara').click();">
                            📸 Tomar Foto
                        </button>
                        <button type="button" class="btn-foto btn-secundario" onclick="document.getElementById('inputGaleria').click();">
                            🖼️ Cargar de Galería
                        </button>
                    </div>

                    <!-- Inputs ocultos para cámara y galería -->
                    <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoSeleccionada(this)">
                    <input type="file" id="inputGaleria" accept="image/*" style="display: none;" onchange="procesarFotoSeleccionada(this)">

                    <!-- Vista previa de la imagen seleccionada/tomada -->
                    <div id="previewContainer" class="preview-container" style="display: none;">
                        <img id="imgPreview" src="" alt="Vista previa del objeto" class="img-preview">
                        <button type="button" class="btn-eliminar-foto" onclick="limpiarFoto()">✕ Quitar foto</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-block" style="margin-top: 1.5rem;">Guardar y Publicar en Catálogo</button>
            </form>
        </div>
    </div>

    <!-- Modal: Dar de Baja / Procesar Salida -->
    <div id="modalBaja" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Procesar Salida</h3>
                <button class="btn-close" onclick="cerrarModalBaja()">×</button>
            </div>
            <form id="formBaja" onsubmit="guardarBaja(event)" autocomplete="off">
                <p class="text-muted">Procesando código: <strong id="bajaCodigoVisible"></strong></p>
                <input type="hidden" id="bajaCodigoElemento">
                
                <div class="form-group">
                    <label>Tipo de Salida *</label>
                    <select id="bajaEstado" class="form-control" required>
                        <option value="Reclamado">Reclamado (Entregado a dueño)</option>
                        <option value="Baja">Dado de baja (Donación/Disposición final)</option>
                    </select>
                </div>
                
                <div class="form-group" style="display:flex; gap:1rem;">
                    <div style="flex:1;"><label>Fecha *</label><input type="date" id="bajaFecha" class="form-control" required></div>
                    <div style="flex:1;"><label>Hora *</label><input type="time" id="bajaHora" class="form-control" required></div>
                </div>
                
                <div class="form-group">
                    <label>Categoría de quien retira *</label>
                    <select id="bajaCategoria" class="form-control" required>
                        <option value="Estudiante">Estudiante</option>
                        <option value="Colaborador">Colaborador</option>
                        <option value="Proveedor">Proveedor</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Nombre a quien se entrega o retira *</label>
                    <input type="text" id="bajaNombre" class="form-control" required placeholder="Ej: Juan Pérez" autocomplete="off">
                </div>

                <!-- Campo de trazabilidad manual desvinculado de autocompletado del navegador -->
                <div class="form-group" style="border-top: 1px dashed #ccc; padding-top: 1rem; margin-top: 1rem;">
                    <label style="color: var(--primary-color, #005A43); font-weight: bold;">Funcionario que procesa la salida (Responsable en turno) *</label>
                    <input type="text" id="bajaFuncionario" class="form-control" required placeholder="Nombre del colaborador en turno" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary btn-block" style="background-color: #d93025; margin-top: 1rem;">Confirmar Salida</button>
            </form>
        </div>
    </div>

    <script>
    // Validar sesión activa del usuario de Registro
    const usuarioActivo = JSON.parse(localStorage.getItem('ecos_usuario_activo'));
    if (!usuarioActivo) {
        window.location.href = '../login.html';
    }

    let objetosInventario = [];
    let archivoFotoSeleccionado = null; // Variable global para almacenar la foto capturada o elegida

    // Procesar selección de foto (Cámara o Galería)
    function procesarFotoSeleccionada(input) {
        if (input.files && input.files[0]) {
            const archivo = input.files[0];

            if (!archivo.type.startsWith('image/')) {
                alert('Por favor selecciona un archivo de imagen válido.');
                return;
            }

            archivoFotoSeleccionado = archivo;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imgPreview').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsDataURL(archivo);
        }
    }

    // Limpiar selección de foto y ocultar previsualización
    function limpiarFoto() {
        archivoFotoSeleccionado = null;
        const inputCamara = document.getElementById('inputCamara');
        const inputGaleria = document.getElementById('inputGaleria');
        const imgPreview = document.getElementById('imgPreview');
        const previewContainer = document.getElementById('previewContainer');

        if (inputCamara) inputCamara.value = '';
        if (inputGaleria) inputGaleria.value = '';
        if (imgPreview) imgPreview.src = '';
        if (previewContainer) previewContainer.style.display = 'none';
    }

    // Convierte y comprime la imagen a máximo 600px de ancho/alto con calidad optimizada
    function convertirImagenABase64(archivo) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(archivo);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const MAX_HEIGHT = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64Comprimido = canvas.toDataURL('image/jpeg', 0.5);
                    resolve(base64Comprimido);
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }

    // Registrar objeto desde el panel de Registro
    async function guardarElemento(event) {
        event.preventDefault();

        let cadenaBase64 = null;

        if (archivoFotoSeleccionado) {
            try {
                cadenaBase64 = await convertirImagenABase64(archivoFotoSeleccionado);
            } catch (error) {
                alert('Error al procesar la imagen seleccionada.');
                return;
            }
        }

        const nuevoObjeto = {
            fecha_hallazgo: document.getElementById('fechaHallazgo').value,
            lugar_hallazgo: document.getElementById('lugarHallazgo').value,
            clasificacion: document.getElementById('clasificacion').value,
            descripcion: document.getElementById('descripcion').value,
            ruta_foto: cadenaBase64
        };

        try {
            const response = await fetch('https://objetos-recuperadosean.onrender.com/api/objetos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoObjeto)
            });

            if (!response.ok) throw new Error('Error al registrar el objeto');

            const resultado = await response.json();
            alert(`Objeto #${resultado.data.codigo} registrado exitosamente en Supabase.`);
            
            cerrarModalCarga();
            cargarTablaRegistro();
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    }

    // Consultar tabla de registro
    async function cargarTablaRegistro() {
        const tbody = document.getElementById('cuerpoTablaAdmin') || document.getElementById('cuerpoTablaRegistro');
        if (!tbody) return;

        try {
            const response = await fetch('https://objetos-recuperadosean.onrender.com/api/objetos');
            if (!response.ok) throw new Error('Error de conexión');

            objetosInventario = await response.json();
            
            const activosCount = objetosInventario.filter(obj => obj.estado_actual === 'Activo').length;
            const elemContador = document.getElementById('contadorActivos');
            if (elemContador) elemContador.innerText = activosCount;

            const terminoBusqueda = document.getElementById('buscadorCodigo') ? document.getElementById('buscadorCodigo').value.trim().toLowerCase().replace('#', '') : "";
            
            const filtrados = objetosInventario.filter(obj => {
                const coincideCodigo = String(obj.codigo).toLowerCase().includes(terminoBusqueda);
                return coincideCodigo && obj.estado_actual === 'Activo';
            });

            tbody.innerHTML = '';

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 2rem; color: #6C757D;">No hay objetos activos que coincidan con la consulta.</td></tr>`;
                return;
            }

            filtrados.forEach(obj => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${obj.codigo}</strong></td>
                    <td>
                        <img src="${obj.ruta_foto || 'https://via.placeholder.com/40?text=Foto'}" 
                             alt="Foto #${obj.codigo}" 
                             class="img-miniatura-zoom">
                    </td>
                    <td><span class="tag-category">${obj.clasificacion}</span></td>
                    <td>${obj.descripcion}</td>
                    <td>${obj.lugar_hallazgo}</td>
                    <td>${obj.fecha_hallazgo}</td>
                    <td><span class="badge bg-success">${obj.estado_actual}</span></td>
                    <td>
                        <button class="btn-sm btn-baja" onclick="abrirBaja(${obj.codigo})">Procesar Salida</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error al cargar inventario:', error);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: red; padding: 1rem;">Error de conexión con el servidor backend.</td></tr>`;
        }
    }

    const inputBuscador = document.getElementById('buscadorCodigo');
    if (inputBuscador) {
        inputBuscador.addEventListener('input', cargarTablaRegistro);
    }

    function abrirModalCarga() {
        limpiarFoto();
        const modal = document.getElementById('modalCarga');
        if (modal) modal.style.display = 'flex';
        const fechaInput = document.getElementById('fechaHallazgo');
        if (fechaInput) fechaInput.valueAsDate = new Date();
    }

    function cerrarModalCarga() {
        const modal = document.getElementById('modalCarga');
        if (modal) modal.style.display = 'none';
        const form = document.getElementById('formSubirElemento');
        if (form) form.reset();
        limpiarFoto();
    }

    function abrirBaja(codigo) {
        const form = document.getElementById('formBaja');
        if (form) form.reset();

        const elemVis = document.getElementById('bajaCodigoVisible');
        const elemVal = document.getElementById('bajaCodigoElemento');
        if (elemVis) elemVis.innerText = "#" + codigo;
        if (elemVal) elemVal.value = codigo;

        const ahora = new Date();
        const fechaInput = document.getElementById('bajaFecha');
        const horaInput = document.getElementById('bajaHora');

        if (fechaInput) fechaInput.valueAsDate = ahora;
        if (horaInput) horaInput.value = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}`;

        const inputFuncionario = document.getElementById('bajaFuncionario');
        if (inputFuncionario) {
            inputFuncionario.value = '';
        }

        const modal = document.getElementById('modalBaja');
        if (modal) modal.style.display = 'flex';
    }

    function cerrarModalBaja() {
        const modal = document.getElementById('modalBaja');
        if (modal) modal.style.display = 'none';
        const form = document.getElementById('formBaja');
        if (form) form.reset();
    }

    // Procesar salida verificando firma manual
    async function guardarBaja(event) {
        event.preventDefault();

        const funcionarioTurno = document.getElementById('bajaFuncionario').value.trim();
        if (!funcionarioTurno) {
            alert("Por favor ingrese el nombre del funcionario responsable del turno.");
            return;
        }

        const datosBaja = {
            codigo_objeto: parseInt(document.getElementById('bajaCodigoElemento').value),
            tipo_salida: document.getElementById('bajaEstado').value,
            fecha_salida: document.getElementById('bajaFecha').value,
            hora_salida: document.getElementById('bajaHora').value,
            categoria_retira: document.getElementById('bajaCategoria').value,
            nombre_retira: document.getElementById('bajaNombre').value,
            funcionario_entrega: funcionarioTurno, // 👈 Se agrega la propiedad faltante
            id_funcionario: usuarioActivo.id_usuario
        };

        try {
            const response = await fetch('https://objetos-recuperadosean.onrender.com/api/objetos/baja', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosBaja)
            });

            if (!response.ok) throw new Error('Error al registrar la salida en el servidor');

            const resultado = await response.json();
            alert(resultado.mensaje);

            cerrarModalBaja();
            cargarTablaRegistro();
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    }

    window.onload = function() {
        cargarTablaRegistro();
    };
    </script>
    
</body>
</html>
