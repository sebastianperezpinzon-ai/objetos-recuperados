<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - ECO-S</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="auth-header">
                <h2>Gestión Operativa</h2>
                <p>Ingresa tus credenciales para administrar el inventario de objetos recuperados.</p>
            </div>

            <!-- Contenedor para mostrar errores de inicio de sesión -->
            <div id="mensajeError" class="error-message">
                Credenciales incorrectas o usuario no autorizado.
            </div>

            <form id="formLogin" onsubmit="procesarLogin(event)">
                <div class="form-group">
                    <label for="correoUsuario">Correo Institucional</label>
                    <input type="email" id="correoUsuario" class="form-control" required placeholder="usuario@institucion.edu.co">
                </div>

                <div class="form-group">
                    <label for="passwordUsuario">Contraseña</label>
                    <input type="password" id="passwordUsuario" class="form-control" required placeholder="Ingresa tu contraseña alfanumérica">
                </div>

                <button type="submit" class="btn-primary btn-block">Iniciar Sesión</button>
            </form>

            <div class="auth-footer">
                <a href="index.html">← Volver al catálogo público</a>
            </div>
        </section>
    </main>

    <script>
        async function procesarLogin(event) {
    event.preventDefault(); // Evita el recargado de la página
    
    const correoInput = document.getElementById('correoUsuario').value.trim().toLowerCase();
    const passwordInput = document.getElementById('passwordUsuario').value;
    const errorDiv = document.getElementById('mensajeError');

    // Limpiamos mensajes de error previos
    errorDiv.style.display = 'none';

    try {
        // 1. Petición HTTP POST a la API en FastAPI
        const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                correo: correoInput,
                password: passwordInput
            })
        });

        const data = await response.json();

        // 2. Si la API responde con error (401, 403, 422, etc.)
        if (!response.ok) {
            throw new Error(data.detail || 'Credenciales incorrectas o usuario no autorizado.');
        }

        // 3. Almacenamos la sesión del usuario activo (incluye su id_usuario para trazabilidad)
        localStorage.setItem('ecos_usuario_activo', JSON.stringify(data.usuario));

        console.log(`Sesión iniciada: ${data.usuario.correo} | Rol: ${data.usuario.rol}`);

        // 4. Enrutamiento según el rol devuelto por la base de datos
        const rol = data.usuario.rol;
        if (rol === 'Administrador') {
            window.location.href = 'users/administrator.html';
        } else if (rol === 'Técnico') {
            window.location.href = 'users/tecnico.html';
        } else if (rol === 'Registro') {
            window.location.href = 'users/registro.html';
        }

    } catch (error) {
        // Muestra el mensaje devuelto por FastAPI en la interfaz
        errorDiv.innerText = error.message;
        errorDiv.style.display = 'block';
    }
}
    </script>
</body>
</html>
